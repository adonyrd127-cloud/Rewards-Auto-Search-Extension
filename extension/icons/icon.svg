<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>
    <linearGradient id="zapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle Card -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8" />
  
  <!-- Glowing Hex Shield Perimeter -->
  <path d="M256 64 L416 136 L416 280 Q416 392 256 448 Q96 392 96 280 L96 136 Z" fill="url(#shieldGrad)" opacity="0.15" filter="url(#glow)" />
  <path d="M256 64 L416 136 L416 280 Q416 392 256 448 Q96 392 96 280 L96 136 Z" fill="none" stroke="url(#shieldGrad)" stroke-width="12" stroke-linejoin="round" />

  <!-- Inner Radiant Star Emblem -->
  <path d="M256 128 L285 204 L366 211 L305 264 L323 344 L256 302 L189 344 L207 264 L146 211 L227 204 Z" fill="url(#starGrad)" filter="url(#glow)" />

  <!-- Lightning Bolt Over Star -->
  <polygon points="266 160 216 264 256 264 246 336 296 232 256 232" fill="url(#zapGrad)" stroke="#060911" stroke-width="6" stroke-linejoin="round" />

  <!-- Sparkle dots -->
  <circle cx="140" cy="140" r="10" fill="#06b6d4" opacity="0.8" />
  <circle cx="372" cy="140" r="10" fill="#10b981" opacity="0.8" />
  <circle cx="256" cy="400" r="8" fill="#fbbf24" opacity="0.8" />
</svg>
